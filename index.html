<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Time Budget v2</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 { margin-top: 0; text-align: center; font-size: 1.5rem; }

        /* Controls */
        .controls {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-secondary {
            background-color: transparent;
            color: #64748b;
            border: 1px solid #cbd5e1;
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-secondary:hover { background-color: #f1f5f9; color: var(--text); }

        /* Chart */
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
            margin-bottom: 20px;
        }

        .stats {
            text-align: center;
            font-weight: 500;
            margin-bottom: 20px;
            color: var(--primary);
            font-size: 1.1rem;
        }

        /* Inputs */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        input {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
        }
        input:focus { outline: 2px solid var(--primary); border-color: transparent; }

        /* Flex sizing for inputs */
        input[type="text"] { flex: 3; } /* Label takes most space */
        input[type="number"] { flex: 1; min-width: 60px; } /* Small inputs for time */

        .btn-primary {
            padding: 10px 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-primary:hover { opacity: 0.9; }

        /* List */
        .activity-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .activity-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 10px;
            border-bottom: 1px solid var(--border);
        }
        .activity-item:last-child { border-bottom: none; }

        .item-info { display: flex; align-items: center; gap: 10px; }
        .color-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

        .delete-btn {
            color: var(--danger);
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px;
            font-size: 0.9rem;
        }
        .delete-btn:hover { text-decoration: underline; }

    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <button class="btn-secondary" onclick="resetData()">Reset</button>
        <button class="btn-secondary" onclick="downloadData()">Download</button>
        <button class="btn-secondary" onclick="document.getElementById('importFile').click()">Upload</button>
        <input type="file" id="importFile" style="display:none" onchange="importData(this)" accept=".json">
    </div>

    <h1>Daily Time Budget</h1>

    <div class="chart-container">
        <canvas id="timeChart"></canvas>
    </div>

    <div class="stats" id="statusText">
        Loading...
    </div>

    <div class="input-group">
        <input type="text" id="labelInput" placeholder="Activity (e.g. Gym)" onkeypress="handleEnter(event)" />
        <input type="number" id="hrsInput" placeholder="Hrs" min="0" max="24" onkeypress="handleEnter(event)" />
        <input type="number" id="minsInput" placeholder="Mins" min="0" max="59" onkeypress="handleEnter(event)" />
        
        <button class="btn-primary" onclick="addActivity()">Add</button>
    </div>

    <ul class="activity-list" id="activityList"></ul>
</div>

<script>
    // --- STATE ---
    let activities = [];
    const TOTAL_MINUTES = 24 * 60; // 1440 minutes
    let myChart = null;
    const STORAGE_KEY = 'dailyTimeBudget_v2'; // New key to avoid conflicts with v1
    const palette = ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#6366f1', '#14b8a6'];

    // --- HELPERS ---

    // Convert minutes to "1h 30m" or "45m" string
    function formatTime(minutes) {
        const h = Math.floor(minutes / 60);
        const m = Math.round(minutes % 60);
        
        if (h > 0 && m > 0) return `${h}h ${m}m`;
        if (h > 0) return `${h}h`;
        return `${m}m`;
    }

    // --- CORE ---

    function init() {
        initChart();
        loadFromStorage();
    }

    function updateAll() {
        updateChart();
        renderList();
        saveToStorage();
    }

    function addActivity() {
        const labelInput = document.getElementById('labelInput');
        const hrsInput = document.getElementById('hrsInput');
        const minsInput = document.getElementById('minsInput');
        
        const label = labelInput.value.trim();
        const hrs = parseInt(hrsInput.value) || 0;
        const mins = parseInt(minsInput.value) || 0;
        
        const totalDurationMins = (hrs * 60) + mins;

        // Validation
        if (!label) {
            alert("Please enter an activity name.");
            return;
        }
        if (totalDurationMins <= 0) {
            alert("Duration must be greater than 0.");
            return;
        }

        const currentUsed = activities.reduce((acc, curr) => acc + curr.minutes, 0);
        if (currentUsed + totalDurationMins > TOTAL_MINUTES) {
            const left = TOTAL_MINUTES - currentUsed;
            alert(`Not enough time! You only have ${formatTime(left)} left.`);
            return;
        }

        activities.push({ label, minutes: totalDurationMins, id: Date.now() });
        
        // Reset Inputs
        labelInput.value = '';
        hrsInput.value = '';
        minsInput.value = '';
        labelInput.focus();

        updateAll();
    }

    function removeActivity(index) {
        activities.splice(index, 1);
        updateAll();
    }

    // --- VISUALIZATION ---

    function initChart() {
        const ctx = document.getElementById('timeChart').getContext('2d');
        myChart = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: [],
                datasets: [{
                    data: [],
                    backgroundColor: [],
                    borderWidth: 2,
                    borderColor: '#ffffff'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 400 },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            // Custom tooltip to show "1h 30m" instead of raw minutes
                            label: function(context) {
                                const rawMins = context.raw;
                                return ` ${context.label}: ${formatTime(rawMins)}`;
                            }
                        }
                    }
                }
            }
        });
    }

    function updateChart() {
        const usedMins = activities.reduce((acc, curr) => acc + curr.minutes, 0);
        const freeMins = TOTAL_MINUTES - usedMins;

        const labels = activities.map(a => a.label);
        const data = activities.map(a => a.minutes);
        const colors = activities.map((_, i) => palette[i % palette.length]);

        // "Grey Section" for Free Time
        if (freeMins > 0) {
            labels.push('Free Time');
            data.push(freeMins);
            colors.push('#e2e8f0');
        }

        myChart.data.labels = labels;
        myChart.data.datasets[0].data = data;
        myChart.data.datasets[0].backgroundColor = colors;
        myChart.update();

        document.getElementById('statusText').innerText = 
            `${formatTime(usedMins)} Planned  |  ${formatTime(freeMins)} Free`;
    }

    function renderList() {
        const list = document.getElementById('activityList');
        list.innerHTML = '';

        activities.forEach((act, index) => {
            const color = palette[index % palette.length];
            const li = document.createElement('li');
            li.className = 'activity-item';
            li.innerHTML = `
                <div class="item-info">
                    <span class="color-dot" style="background-color: ${color}"></span>
                    <span><strong>${act.label}</strong>: ${formatTime(act.minutes)}</span>
                </div>
                <button class="delete-btn" onclick="removeActivity(${index})">Remove</button>
            `;
            list.appendChild(li);
        });
    }

    // --- STORAGE & FILES ---

    function saveToStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(activities));
    }

    function loadFromStorage() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                activities = JSON.parse(saved);
            } catch (e) { console.error("Data Load Error"); }
        }
        updateChart();
        renderList();
    }

    function downloadData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(activities));
        const a = document.createElement('a');
        a.href = dataStr;
        a.download = "daily_budget_v2.json";
        document.body.appendChild(a);
        a.click();
        a.remove();
    }

    function importData(input) {
        const file = input.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const json = JSON.parse(e.target.result);
                // Check if data uses 'minutes' instead of 'hours'
                const valid = Array.isArray(json) && json.every(i => i.label && i.minutes !== undefined);
                if(valid) {
                    if(confirm("Overwrite current list?")) {
                        activities = json;
                        updateAll();
                    }
                } else {
                    alert("Invalid file format (must be v2 JSON).");
                }
            } catch(err) { alert("Error reading file"); }
            input.value = '';
        };
        reader.readAsText(file);
    }

    function resetData() {
        if(confirm("Reset everything?")) {
            activities = [];
            updateAll();
        }
    }

    function handleEnter(e) {
        if (e.key === 'Enter') addActivity();
    }

    init();
</script>

</body>
</html>
